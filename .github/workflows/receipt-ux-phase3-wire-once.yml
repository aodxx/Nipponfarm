name: Wire Receipt Workflow Progress Once

on:
  push:
    branches:
      - consolidation/receipt-expense-phase3

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation/receipt-expense-phase3
          fetch-depth: 0
      - name: Wire receipt workflow progress
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ScanReceipt.tsx')
          s = p.read_text()

          import_marker = "import { optimizeImage } from '../services/imageOptimizer';"
          progress_import = import_marker + "\nimport ReceiptWorkflowProgress from '../components/ReceiptWorkflowProgress';"
          if 'ReceiptWorkflowProgress' not in s:
              if import_marker not in s:
                  raise SystemExit('import marker not found')
              s = s.replace(import_marker, progress_import, 1)

          root_marker = '<div className="min-h-screen bg-transparent text-slate-900 dark:text-white pb-20 overflow-x-hidden">'
          insert = root_marker + "\n      <ReceiptWorkflowProgress\n        stage={isSaving ? 'saving' : analysisResult ? 'review' : isAnalyzing || capturedImage ? 'processing' : 'capture'}\n      />"
          if '<ReceiptWorkflowProgress' not in s:
              if root_marker not in s:
                  raise SystemExit('root marker not found')
              s = s.replace(root_marker, insert, 1)

          p.write_text(s)
          PY
      - run: npm ci --no-audit
      - run: npm run test:auth
      - run: npm run lint
      - run: npm run build
      - name: Commit wired receipt workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ScanReceipt.tsx
          git commit -m 'feat: surface receipt workflow stages' || exit 0
          git push origin HEAD:consolidation/receipt-expense-phase3
