name: Wire Consolidated Navigation Once

on:
  push:
    branches:
      - consolidation/navigation-phase2

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation/navigation-phase2
          fetch-depth: 0
      - name: Wire consolidated navigation dock
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Layout.tsx')
          s = p.read_text()

          import_marker = "import ProfileSettingsHub from './ProfileSettingsHub';"
          import_line = import_marker + "\nimport ConsolidatedNavDock from './ConsolidatedNavDock';"
          if "ConsolidatedNavDock" not in s:
              if import_marker not in s:
                  raise SystemExit('import marker not found')
              s = s.replace(import_marker, import_line, 1)

          marker = "      {/* Enhanced Bottom Navigation (Floating Dock) with Curved Liquid Animation */}"
          if marker not in s:
              raise SystemExit('bottom navigation marker not found')
          if "<ConsolidatedNavDock />" not in s:
              s = s.replace(marker, "      <ConsolidatedNavDock />\n\n" + marker, 1)

          old_class = 'className="fixed bottom-0 left-0 right-0 w-full z-20 pointer-events-none pb-safe px-4 pb-4"'
          new_class = 'className="hidden fixed bottom-0 left-0 right-0 w-full z-20 pointer-events-none pb-safe px-4 pb-4"'
          if old_class not in s and new_class not in s:
              raise SystemExit('legacy nav class marker not found')
          s = s.replace(old_class, new_class, 1)

          p.write_text(s)
          PY
      - run: npm ci --no-audit
      - run: npm run test:auth
      - run: npm run lint
      - run: npm run build
      - name: Commit wired navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Layout.tsx
          git commit -m 'feat: simplify primary navigation to five categories' || exit 0
          git push origin HEAD:consolidation/navigation-phase2
