name: Wire Today Dashboard Once

on:
  push:
    branches:
      - consolidation/today-dashboard-phase1

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation/today-dashboard-phase1
          fetch-depth: 0
      - name: Wire Today Dashboard with legacy fallback route
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "const Dashboard = lazy(() => import('./pages/Dashboard'));"
          new = "const TodayDashboard = lazy(() => import('./pages/TodayDashboard'));\nconst DashboardLegacy = lazy(() => import('./pages/Dashboard'));"
          if old not in s:
              raise SystemExit('Dashboard import marker not found')
          s = s.replace(old, new, 1)
          old_route = '<Route index element={<Dashboard />} />'
          new_route = '<Route index element={<TodayDashboard />} />\n            <Route path="dashboard-legacy" element={<DashboardLegacy />} />'
          if old_route not in s:
              raise SystemExit('Dashboard route marker not found')
          s = s.replace(old_route, new_route, 1)
          p.write_text(s)
          PY
      - run: npm ci --no-audit
      - run: npm run test:auth
      - run: npm run lint
      - run: npm run build
      - name: Commit wired route
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'feat: make today dashboard the primary home' || exit 0
          git push origin HEAD:consolidation/today-dashboard-phase1
