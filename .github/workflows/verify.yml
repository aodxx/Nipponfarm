name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:auth
      - run: npm run lint
      - run: npm run build
      - name: Smoke standalone startup without Firebase runtime env
        run: |
          env \
            -u VITE_FIREBASE_API_KEY \
            -u VITE_FIREBASE_AUTH_DOMAIN \
            -u VITE_FIREBASE_PROJECT_ID \
            -u VITE_FIREBASE_STORAGE_BUCKET \
            -u VITE_FIREBASE_MESSAGING_SENDER_ID \
            -u VITE_FIREBASE_APP_ID \
            NODE_ENV=production PORT=3210 node dist/server.cjs > /tmp/nipponfarm-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3210/api/health > /tmp/nipponfarm-health.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/nipponfarm-server.log
          cat /tmp/nipponfarm-health.json
          grep -q '"status":"ok"' /tmp/nipponfarm-health.json
