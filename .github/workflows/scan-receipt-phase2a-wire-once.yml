name: Wire Scan Receipt Phase2A Once

on:
  push:
    branches:
      - refactor/scan-receipt-phase2a

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/scan-receipt-phase2a
          fetch-depth: 0
      - name: Wire extracted receipt helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/ScanReceipt.tsx')
          text = path.read_text()

          text = text.replace(
              "import { saveScannedBill, getHistoricalItemDescriptions, getHistoricalVendors } from '../services/billService';",
              "import { saveScannedBill } from '../services/billService';",
          )
          marker = "import ReceiptSaveSuccess from '../components/ReceiptSaveSuccess';"
          extra = "\nimport { isGenericMerchantName, normalizeReceiptDate } from '../features/receipt/scanReceiptUtils';\nimport { useReceiptAnalysisProgress, useReceiptHistoryLookups, useReceiptServerStatus } from '../features/receipt/useScanReceiptSupport';"
          if extra.strip() not in text:
              text = text.replace(marker, marker + extra)

          text, count = re.subn(
              r"\nconst isGenericMerchantName = .*?\nexport default function ScanReceipt\(\) \{",
              "\nexport default function ScanReceipt() {",
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected utility block once, found {count}')

          text, count = re.subn(
              r"\n  const \[analysisProgress, setAnalysisProgress\] = useState\(0\);.*?\n  \}, \[isAnalyzing\]\);",
              "",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('analysis progress block not found')

          text = text.replace("\n  const [serverStatus, setServerStatus] = useState<'checking' | 'connected' | 'no-key' | 'error'>('checking');", "")
          text = text.replace("\n  const [historicalDescriptions, setHistoricalDescriptions] = useState<string[]>([]);", "")
          text = text.replace("\n  const [historicalVendors, setHistoricalVendors] = useState<string[]>([]);", "")

          text, count = re.subn(
              r"\n  useEffect\(\(\) => \{\n    const fetchHistorical = async \(\) => \{.*?\n  \}, \[\]\);",
              "",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('historical lookup effect not found')

          state_marker = "  const [showAllReviewItems, setShowAllReviewItems] = useState(false);"
          hooks = "\n  const analysisProgress = useReceiptAnalysisProgress(isAnalyzing);\n  const serverStatus = useReceiptServerStatus();\n  const { historicalDescriptions, historicalVendors, setHistoricalVendors } = useReceiptHistoryLookups();"
          if hooks.strip() not in text:
              text = text.replace(state_marker, state_marker + hooks)

          text = text.replace(
              "  useEffect(() => {\n    checkServerStatus();\n    return () => {\n      stopCamera();\n    };\n  }, []);",
              "  useEffect(() => {\n    return () => {\n      stopCamera();\n    };\n  }, []);",
          )

          text, count = re.subn(
              r"\n  const checkServerStatus = async \(\) => \{.*?\n  \};\n\n  const startCamera",
              "\n  const startCamera",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('server status function not found')

          text = text.replace('normalizeDateStr(result.date)', 'normalizeReceiptDate(result.date)')
          path.write_text(text)
          PY
      - run: npm ci --no-audit
      - run: npm run test:auth
      - run: npm run lint
      - run: npm run build
      - name: Commit refactor wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ScanReceipt.tsx
          git commit -m 'refactor: wire receipt support helpers' || exit 0
          git push origin HEAD:refactor/scan-receipt-phase2a
