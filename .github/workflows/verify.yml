name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure required Tailwind animation CSS is installed
        run: test -f node_modules/tw-animate-css/dist/tw-animate.css || npm install --no-save --package-lock=false --ignore-scripts tw-animate-css@1.4.0
      - run: npm run test:auth
      - run: npm run lint
      - run: npm run build
