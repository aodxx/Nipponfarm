name: Wire Receipt Review Simplification Once

on:
  push:
    branches:
      - consolidation/receipt-expense-phase5

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation/receipt-expense-phase5
          fetch-depth: 0
      - name: Simplify receipt review screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ScanReceipt.tsx')
          s = p.read_text()

          state_marker = "  const [isEditing, setIsEditing] = useState(false);"
          state_replacement = state_marker + "\n  const [showAllReviewItems, setShowAllReviewItems] = useState(false);"
          if 'showAllReviewItems' not in s:
              if state_marker not in s:
                  raise SystemExit('review state marker not found')
              s = s.replace(state_marker, state_replacement, 1)

          map_marker = "                {editableItems.map((item, idx) => ("
          map_replacement = "                {editableItems.slice(0, showAllReviewItems ? editableItems.length : 3).map((item, idx) => ("
          if map_marker in s:
              s = s.replace(map_marker, map_replacement, 1)
          elif map_replacement not in s:
              raise SystemExit('items map marker not found')

          after_items = '''                ))}\n\n                <div className="pt-4 mt-4 border-t border-slate-100 dark:border-white/5">'''
          toggle = '''                ))}\n\n                {editableItems.length > 3 && (\n                  <button\n                    type="button"\n                    onClick={() => setShowAllReviewItems((value) => !value)}\n                    className="w-full min-h-11 rounded-2xl border border-slate-200 bg-slate-50 px-4 text-sm font-bold text-slate-600 transition active:scale-[0.99] dark:border-white/10 dark:bg-white/5 dark:text-white/70"\n                    aria-expanded={showAllReviewItems}\n                  >\n                    {showAllReviewItems\n                      ? 'ย่อรายการสินค้า'\n                      : `ดูทั้งหมดอีก ${editableItems.length - 3} รายการ`}\n                  </button>\n                )}\n\n                <div className="pt-4 mt-4 border-t border-slate-100 dark:border-white/5">'''
          if after_items in s:
              s = s.replace(after_items, toggle, 1)
          elif 'ดูทั้งหมดอีก ${editableItems.length - 3} รายการ' not in s:
              raise SystemExit('items toggle insertion marker not found')

          old_note = '''              {analysisResult.analysisNote && (\n                <div className="bg-slate-50 dark:bg-white/5 p-4 rounded-2xl border border-slate-100 dark:border-white/5">\n                  <p className="text-[10px] text-slate-400 dark:text-white/30 uppercase font-black mb-1">AI Note</p>\n                  <p className="text-xs italic text-slate-600 dark:text-white/60 leading-relaxed font-medium">\n                    "{analysisResult.analysisNote}"\n                  </p>\n                </div>\n              )}'''
          new_note = '''              {analysisResult.analysisNote && (\n                <details className="group rounded-2xl border border-slate-200 bg-slate-50/70 p-4 dark:border-white/10 dark:bg-white/5">\n                  <summary className="cursor-pointer list-none text-sm font-bold text-slate-600 dark:text-white/65">\n                    รายละเอียดจาก AI\n                    <span className="ml-2 text-xs text-slate-400 group-open:hidden">แตะเพื่อดู</span>\n                  </summary>\n                  <p className="mt-3 text-xs italic leading-relaxed text-slate-600 dark:text-white/60">\n                    "{analysisResult.analysisNote}"\n                  </p>\n                </details>\n              )}'''
          if old_note in s:
              s = s.replace(old_note, new_note, 1)
          elif 'รายละเอียดจาก AI' not in s:
              raise SystemExit('AI note marker not found')

          cta = '''                  {isSaving ? "กำลังบันทึก..." : isTotalMatching ? "บันทึกข้อมูล" : "บันทึกข้อมูล"}'''
          new_cta = '''                  {isSaving ? "กำลังบันทึก..." : "ยืนยันและบันทึกรายจ่าย"}'''
          if cta in s:
              s = s.replace(cta, new_cta, 1)
          elif 'ยืนยันและบันทึกรายจ่าย' not in s:
              raise SystemExit('save CTA marker not found')

          reset_marker = '''  const reset = () => {\n    setSaveComplete(false);'''
          reset_replacement = '''  const reset = () => {\n    setSaveComplete(false);\n    setShowAllReviewItems(false);'''
          if reset_marker in s:
              s = s.replace(reset_marker, reset_replacement, 1)
          elif 'setShowAllReviewItems(false);' not in s:
              raise SystemExit('reset marker not found')

          p.write_text(s)
          PY
      - run: npm ci --no-audit
      - run: npm run test:auth
      - run: npm run lint
      - run: npm run build
      - name: Commit simplified receipt review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ScanReceipt.tsx
          git commit -m 'feat: simplify receipt review decision screen' || exit 0
          git push origin HEAD:consolidation/receipt-expense-phase5
