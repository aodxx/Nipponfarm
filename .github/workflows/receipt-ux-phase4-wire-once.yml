name: Wire Receipt Save Completion Once

on:
  push:
    branches:
      - consolidation/receipt-expense-phase4

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidation/receipt-expense-phase4
          fetch-depth: 0
      - name: Wire receipt save completion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ScanReceipt.tsx')
          s = p.read_text()

          progress_import = "import ReceiptWorkflowProgress from '../components/ReceiptWorkflowProgress';"
          success_import = progress_import + "\nimport ReceiptSaveSuccess from '../components/ReceiptSaveSuccess';"
          if "ReceiptSaveSuccess" not in s:
              if progress_import not in s:
                  raise SystemExit('progress import marker not found')
              s = s.replace(progress_import, success_import, 1)

          old_context = "const { showAlert, showSuccess, showError, showLoading, hideLoading } = useBottomSheet();"
          new_context = "const { showAlert, showError, showLoading, hideLoading } = useBottomSheet();"
          if old_context in s:
              s = s.replace(old_context, new_context, 1)

          saving_state = "const [isSaving, setIsSaving] = useState(false);"
          saving_states = saving_state + "\n  const [saveComplete, setSaveComplete] = useState(false);"
          if "const [saveComplete, setSaveComplete]" not in s:
              if saving_state not in s:
                  raise SystemExit('saving state marker not found')
              s = s.replace(saving_state, saving_states, 1)

          old_success = '''      showSuccess("บันทึกข้อมูลบิลและรายการสินค้าเรียบร้อยแล้ว", "สำเร็จ");\n      setShowMismatchWarning(false);\n      reset();'''
          new_success = '''      setShowMismatchWarning(false);\n      setSaveComplete(true);'''
          if old_success not in s:
              raise SystemExit('save success marker not found')
          s = s.replace(old_success, new_success, 1)

          reset_marker = '''  const reset = () => {\n    setCapturedImage(null);'''
          reset_replacement = '''  const reset = () => {\n    setSaveComplete(false);\n    setCapturedImage(null);'''
          if reset_marker not in s:
              raise SystemExit('reset marker not found')
          s = s.replace(reset_marker, reset_replacement, 1)

          return_marker = '''\n  return (\n    <div className="min-h-screen bg-transparent text-slate-900 dark:text-white pb-20 overflow-x-hidden">'''
          success_return = '''\n  if (saveComplete) {\n    return (\n      <ReceiptSaveSuccess\n        vendorName={manualMerchantName}\n        totalAmount={manualTotal}\n        onScanNext={reset}\n        onOpenHistory={() => navigate('/scan/history')}\n      />\n    );\n  }\n\n  return (\n    <div className="min-h-screen bg-transparent text-slate-900 dark:text-white pb-20 overflow-x-hidden">'''
          if return_marker not in s:
              raise SystemExit('return marker not found')
          s = s.replace(return_marker, success_return, 1)

          p.write_text(s)
          PY
      - run: npm ci --no-audit
      - run: npm run test:auth
      - run: npm run lint
      - run: npm run build
      - name: Commit wired receipt completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ScanReceipt.tsx
          git commit -m 'feat: make receipt save completion explicit' || exit 0
          git push origin HEAD:consolidation/receipt-expense-phase4
